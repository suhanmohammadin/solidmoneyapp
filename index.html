<script>
    function triggerIosPulse(element) {
      if (!element) return;
      element.classList.remove('ios-lookup-active');
      void element.offsetWidth;
      element.classList.add('ios-lookup-active');
    }

    const openDrawerBtn = document.getElementById('openDrawerBtn');
    const smDrawerLogo = document.getElementById('smDrawerLogo');

    openDrawerBtn.addEventListener('click', () => {
      triggerIosPulse(openDrawerBtn);
      openDrawer();
    });

    if (smDrawerLogo) {
      smDrawerLogo.addEventListener('click', () => {
        triggerIosPulse(smDrawerLogo);
      });
    }

    const pinAuthModal = document.getElementById('pinAuthModal');
    const pinInput = document.getElementById('pinInput');
    const submitPinBtn = document.getElementById('submitPinBtn');
    const pinErrorMsg = document.getElementById('pinErrorMsg');

    function getTodayPin() {
      const today = new Date();
      const year = today.getFullYear().toString();
      const month = String(today.getMonth() + 1).padStart(2, '0');
      const day = String(today.getDate()).padStart(2, '0');
      return `${year}${month}${day}`;
    }

    function checkAuth() {
      if (localStorage.getItem('appUnlocked') === 'true') {
        pinAuthModal.classList.add('hidden');
      } else {
        pinAuthModal.classList.remove('hidden');
      }
    }

    function validatePin() {
      const expectedPin = getTodayPin();
      if (pinInput.value.trim() === expectedPin) {
        localStorage.setItem('appUnlocked', 'true');
        pinAuthModal.classList.add('hidden');
        pinErrorMsg.classList.add('hidden');
        pinInput.value = '';
      } else {
        pinErrorMsg.classList.remove('hidden');
      }
    }

    submitPinBtn.addEventListener('click', validatePin);
    pinInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') validatePin();
    });

    checkAuth();

    function toggleModal(modalElem, show) {
      if (show) {
        document.body.classList.add('overflow-hidden');
        modalElem.classList.remove('hidden');
      } else {
        document.body.classList.remove('overflow-hidden');
        modalElem.classList.add('hidden');
      }
    }

    const authModalOverlay = document.getElementById('authModalOverlay');
    const openAuthModalBtn = document.getElementById('openAuthModalBtn');
    const closeAuthModalBtn = document.getElementById('closeAuthModalBtn');
    const userEmailInput = document.getElementById('userEmailInput');
    const userPasswordInput = document.getElementById('userPasswordInput');
    const firebaseLoginBtn = document.getElementById('firebaseLoginBtn');
    const firebaseSignupBtn = document.getElementById('firebaseSignupBtn');
    const firebaseErrorMsg = document.getElementById('firebaseErrorMsg');
    
    const accountEmailLabel = document.getElementById('accountEmailLabel');
    const accountSyncBadge = document.getElementById('accountSyncBadge');
    const userAvatar = document.getElementById('userAvatar');

    let currentUserUid = null;

    window.addEventListener('load', () => {
      const checkInterval = setInterval(() => {
        if (window.firebaseAuth) {
          clearInterval(checkInterval);
          window.onAuthStateChanged(window.firebaseAuth, async (user) => {
            if (user) {
              currentUserUid = user.uid;
              accountEmailLabel.textContent = user.email;
              accountSyncBadge.textContent = "☁️ Cloud Synced";
              accountSyncBadge.className = "text-[10px] text-emerald-600 font-bold";
              openAuthModalBtn.textContent = "Sign Out";
              userAvatar.textContent = user.email.charAt(0).toUpperCase();

              await loadCloudData(user.uid);
            } else {
              currentUserUid = null;
              accountEmailLabel.textContent = "Not Signed In";
              accountSyncBadge.textContent = "Local Storage Active";
              accountSyncBadge.className = "text-[10px] text-slate-500 font-medium";
              openAuthModalBtn.textContent = "Sign In";
              userAvatar.textContent = "👤";
              inventoryMaster = loadDefaultInventory();
              salesLedger = JSON.parse(localStorage.getItem('salesLedgerLogs') || '[]');
              renderMasterInventory();
              renderLedgerModal();
            }
          });
        }
      }, 100);
    });

    openAuthModalBtn.addEventListener('click', async () => {
      if (currentUserUid) {
        await window.signOut(window.firebaseAuth);
        toggleModal(authModalOverlay, false);
      } else {
        toggleModal(authModalOverlay, true);
      }
    });

    closeAuthModalBtn.addEventListener('click', () => toggleModal(authModalOverlay, false));

    firebaseLoginBtn.addEventListener('click', async () => {
      firebaseErrorMsg.classList.add('hidden');
      try {
        await window.signInWithEmailAndPassword(window.firebaseAuth, userEmailInput.value.trim(), userPasswordInput.value);
        toggleModal(authModalOverlay, false);
        userEmailInput.value = '';
        userPasswordInput.value = '';
      } catch (err) {
        firebaseErrorMsg.textContent = err.message;
        firebaseErrorMsg.classList.remove('hidden');
      }
    });

    firebaseSignupBtn.addEventListener('click', async () => {
      firebaseErrorMsg.classList.add('hidden');
      try {
        await window.createUserWithEmailAndPassword(window.firebaseAuth, userEmailInput.value.trim(), userPasswordInput.value);
        toggleModal(authModalOverlay, false);
        userEmailInput.value = '';
        userPasswordInput.value = '';
      } catch (err) {
        firebaseErrorMsg.textContent = err.message;
        firebaseErrorMsg.classList.remove('hidden');
      }
    });

    async function saveInventoryToCloud() {
      if (!currentUserUid || !window.firebaseDb) return;
      try {
        const docRef = window.doc(window.firebaseDb, "inventories", currentUserUid);
        await window.setDoc(docRef, { items: inventoryMaster, updatedAt: new Date().toISOString() });
      } catch (err) {
        console.error("Error saving inventory to Firestore:", err);
      }
    }

    async function saveLedgerToCloud() {
      if (!currentUserUid || !window.firebaseDb) return;
      try {
        const docRef = window.doc(window.firebaseDb, "ledgers", currentUserUid);
        await window.setDoc(docRef, { logs: salesLedger, updatedAt: new Date().toISOString() });
      } catch (err) {
        console.error("Error saving ledger to Firestore:", err);
      }
    }

    async function loadCloudData(uid) {
      if (!window.firebaseDb) return;
      try {
        const invRef = window.doc(window.firebaseDb, "inventories", uid);
        const invSnap = await window.getDoc(invRef);
        if (invSnap.exists() && invSnap.data().items) {
          inventoryMaster = invSnap.data().items;
        } else {
          inventoryMaster = loadDefaultInventory();
          await saveInventoryToCloud();
        }
        renderMasterInventory();

        const ledgerRef = window.doc(window.firebaseDb, "ledgers", uid);
        const ledgerSnap = await window.getDoc(ledgerRef);
        if (ledgerSnap.exists() && ledgerSnap.data().logs) {
          salesLedger = ledgerSnap.data().logs;
          localStorage.setItem('salesLedgerLogs', JSON.stringify(salesLedger));
        } else {
          salesLedger = JSON.parse(localStorage.getItem('salesLedgerLogs') || '[]');
          await saveLedgerToCloud();
        }
        renderLedgerModal();
      } catch (err) {
        console.error("Error loading cloud data:", err);
      }
    }

    function loadDefaultInventory() {
      const defaultItems = [
        { rackSrNo: 'R-101', name: 'Paracetamol 500mg', rate: 20, stock: 150, unit: 'pcs' },
        { rackSrNo: 'R-102', name: 'Apples', rate: 180, stock: 50, unit: 'kg' },
        { rackSrNo: 'R-103', name: 'Rice', rate: 60, stock: 200, unit: 'kg' },
        { rackSrNo: 'R-104', name: 'Sugar', rate: 45, stock: 100, unit: 'kg' }
      ];
      return JSON.parse(localStorage.getItem('inventoryMasterList') || JSON.stringify(defaultItems));
    }

    function saveInventoryToStorage() {
      localStorage.setItem('inventoryMasterList', JSON.stringify(inventoryMaster));
      if (currentUserUid) {
        saveInventoryToCloud();
      }
    }

    let currentMode = 'standee';
    let cartItems = [];
    let salesLedger = JSON.parse(localStorage.getItem('salesLedgerLogs') || '[]');
    let backupSalesLedger = JSON.parse(localStorage.getItem('backupSalesLedgerLogs') || '[]');
    let inventoryMaster = loadDefaultInventory();

    const themeMap = {
      'theme-purple': { primary: '#5f259f', dark: '#391163', pill: '#eb7c28' },
      'theme-blue': { primary: '#002e6e', dark: '#00193d', pill: '#00baf2' },
      'theme-teal': { primary: '#00796b', dark: '#004d40', pill: '#00bfa5' },
      'theme-emerald': { primary: '#047857', dark: '#064e3b', pill: '#10b981' },
      'theme-dark': { primary: '#0f172a', dark: '#020617', pill: '#6366f1' }
    };
    let activeThemeKey = 'theme-purple';

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeCalcModal();
        toggleModal(masterInventoryModalOverlay, false);
        toggleModal(addStockModalOverlay, false);
        toggleModal(ledgerModalOverlay, false);
        toggleModal(searchModalOverlay, false);
        toggleModal(authModalOverlay, false);
        closeQrModal();
        closeDrawer();
      }
    });

    const merchantNameInput = document.getElementById('merchantName');
    const upiInput = document.getElementById('upiInput');
    const upiFieldLabel = document.getElementById('upiFieldLabel');
    const amountInput = document.getElementById('amount');
    const vpaPreview = document.getElementById('vpaPreview');

    const fixNameToggle = document.getElementById('fixNameToggle');
    const fixUpiToggle = document.getElementById('fixUpiToggle');
    const nameFixLabel = document.getElementById('nameFixLabel');
    const upiFixLabel = document.getElementById('upiFixLabel');
    
    const cardStandeeBtn = document.getElementById('cardStandeeBtn');
    const cardGenericBtn = document.getElementById('cardGenericBtn');
    const cardCalcBtn = document.getElementById('cardCalcBtn');

    const iconStandee = document.getElementById('iconStandee');
    const badgeStandee = document.getElementById('badgeStandee');
    const iconGeneric = document.getElementById('iconGeneric');
    const genericSvg = document.getElementById('genericSvg');
    const badgeGeneric = document.getElementById('badgeGeneric');
    const iconCalc = document.getElementById('iconCalc');
    const calcSvg = document.getElementById('calcSvg');

    const closeDrawerBtn = document.getElementById('closeDrawerBtn');
    const sideDrawer = document.getElementById('sideDrawer');
    const drawerOverlay = document.getElementById('drawerOverlay');

    const openMasterInventoryModalBtn = document.getElementById('openMasterInventoryModalBtn');
    const closeMasterInventoryModalBtn = document.getElementById('closeMasterInventoryModalBtn');
    const masterInventoryModalOverlay = document.getElementById('masterInventoryModalOverlay');
    
    const openAddStockModalBtn = document.getElementById('openAddStockModalBtn');
    const closeAddStockModalBtn = document.getElementById('closeAddStockModalBtn');
    const addStockModalOverlay = document.getElementById('addStockModalOverlay');

    const masterRackSrNo = document.getElementById('masterRackSrNo');
    const masterItemName = document.getElementById('masterItemName');
    const masterItemRate = document.getElementById('masterItemRate');
    const masterItemStock = document.getElementById('masterItemStock');
    const masterItemUnit = document.getElementById('masterItemUnit');
    const saveMasterItemBtn = document.getElementById('saveMasterItemBtn');
    const masterInventoryTableBody = document.getElementById('masterInventoryTableBody');
    const masterInventoryMobileList = document.getElementById('masterInventoryMobileList');
    const stockSearchInput = document.getElementById('stockSearchInput');

    openAddStockModalBtn.addEventListener('click', () => {
      masterRackSrNo.value = '';
      masterItemName.value = '';
      masterItemRate.value = '';
      masterItemStock.value = '';
      masterItemUnit.value = 'pcs';
      toggleModal(addStockModalOverlay, true);
      setTimeout(() => masterRackSrNo.focus(), 100);
    });

    closeAddStockModalBtn.addEventListener('click', () => {
      toggleModal(addStockModalOverlay, false);
    });

    const searchModalOverlay = document.getElementById('searchModalOverlay');
    const openSearchModalBtn = document.getElementById('openSearchModalBtn');
    const closeSearchModalBtn = document.getElementById('closeSearchModalBtn');
    const liveSearchInput = document.getElementById('liveSearchInput');
    const searchTableBody = document.getElementById('searchTableBody');

    openSearchModalBtn.addEventListener('click', () => {
      liveSearchInput.value = '';
      renderSearchResults('');
      toggleModal(searchModalOverlay, true);
      setTimeout(() => liveSearchInput.focus(), 100);
    });

    closeSearchModalBtn.addEventListener('click', () => {
      toggleModal(searchModalOverlay, false);
    });

    liveSearchInput.addEventListener('input', (e) => {
      renderSearchResults(e.target.value.trim().toLowerCase());
    });

    function renderSearchResults(query) {
      const filtered = salesLedger.filter(item => {
        const cust = (item.customer || '').toLowerCase();
        const phone = (item.phone || '').toLowerCase();
        const amt = (item.amount || '').toString();
        const date = (item.isoDate || '').toLowerCase();
        const time = (item.time || '').toLowerCase();
        return cust.includes(query) || phone.includes(query) || amt.includes(query) || date.includes(query) || time.includes(query);
      });

      if (filtered.length === 0) {
        searchTableBody.innerHTML = `<tr><td colspan="3" class="p-8 text-center text-slate-400 italic">No matching transactions found.</td></tr>`;
      } else {
        searchTableBody.innerHTML = filtered.map(item => `
          <tr>
            <td class="p-2.5 font-mono text-slate-500">${item.isoDate || 'Today'} • ${item.time}</td>
            <td class="p-2.5 font-bold text-slate-800">
              ${item.customer}
              ${item.phone ? `<span class="block text-[11px] font-mono text-slate-500 font-normal">+91 ${item.phone}</span>` : ''}
            </td>
            <td class="p-2.5 text-right font-mono font-extrabold brand-text">₹${item.amount.toFixed(2)}</td>
          </tr>
        `).join('');
      }
    }

    const closeCalcModalBtn = document.getElementById('closeCalcModalBtn');
    const calcModalOverlay = document.getElementById('calcModalOverlay');

    const custName = document.getElementById('custName');
    const custPhone = document.getElementById('custPhone');
    const itemNameInput = document.getElementById('itemNameInput');
    const suggestionsBox = document.getElementById('suggestionsBox');
    
    const flatPriceToggle = document.getElementById('flatPriceToggle');
    const rateContainer = document.getElementById('rateContainer');
    const flatPriceContainer = document.getElementById('flatPriceContainer');
    const flatPriceInput = document.getElementById('flatPriceInput');
    const qtyContainer = document.getElementById('qtyContainer');
    
    const ratePerKg = document.getElementById('ratePerKg');
    const purchaseQty = document.getElementById('purchaseQty');
    const purchaseUnit = document.getElementById('purchaseUnit');
    const addItemBtn = document.getElementById('addItemBtn');
    const clearCartBtn = document.getElementById('clearCartBtn');
    const cartTableBody = document.getElementById('cartTableBody');
    
    const subtotalText = document.getElementById('subtotalText');
    const gstRateInput = document.getElementById('gstRateInput');
    const gstPctDisplay = document.getElementById('gstPctDisplay');
    const gstCalculatedText = document.getElementById('gstCalculatedText');
    const discountInput = document.getElementById('discountInput');
    const discountCalculatedText = document.getElementById('discountCalculatedText');
    const cashSplitInput = document.getElementById('cashSplitInput');
    const changeReturnRow = document.getElementById('changeReturnRow');
    const changeReturnText = document.getElementById('changeReturnText');
    const billResult = document.getElementById('billResult');
    const grandTotalText = document.getElementById('grandTotalText');
    const applyCalcToAmountBtn = document.getElementById('applyCalcToAmountBtn');

    const openLedgerModalBtn = document.getElementById('openLedgerModalBtn');
    const closeLedgerModalBtn = document.getElementById('closeLedgerModalBtn');
    const ledgerModalOverlay = document.getElementById('ledgerModalOverlay');
    const ledgerDateFilter = document.getElementById('ledgerDateFilter');
    const customDateInput = document.getElementById('customDateInput');
    const ledgerTotalSales = document.getElementById('ledgerTotalSales');
    const ledgerCount = document.getElementById('ledgerCount');
    const ledgerCashTotal = document.getElementById('ledgerCashTotal');
    const ledgerUpiTotal = document.getElementById('ledgerUpiTotal');
    const ledgerTableBody = document.getElementById('ledgerTableBody');
    const exportCsvBtn = document.getElementById('exportCsvBtn');
    const clearLedgerBtn = document.getElementById('clearLedgerBtn');

    const qrResultModal = document.getElementById('qrResultModal');
    const closeQrModalBtn = document.getElementById('closeQrModalBtn');
    const whatsappInvoiceBtn = document.getElementById('whatsappInvoiceBtn');

    const renderBtn = document.getElementById('renderBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const printBtn = document.getElementById('printBtn');
    const rawQrWrapper = document.getElementById('rawQrWrapper');
    const canvas = document.getElementById('standeeCanvas');
    const ctx = canvas.getContext('2d');

    flatPriceToggle.addEventListener('change', () => {
      if (flatPriceToggle.checked) {
        rateContainer.classList.add('hidden');
        qtyContainer.classList.add('hidden');
        flatPriceContainer.classList.remove('hidden');
      } else {
        rateContainer.classList.remove('hidden');
        qtyContainer.classList.remove('hidden');
        flatPriceContainer.classList.add('hidden');
      }
    });

    stockSearchInput.addEventListener('input', () => {
      renderMasterInventory();
    });

    function renderMasterInventory() {
      const searchTerm = (stockSearchInput.value || '').toLowerCase().trim();
      const filteredItems = inventoryMaster.filter(item => 
        item.name.toLowerCase().includes(searchTerm) || 
        (item.rackSrNo || '').toLowerCase().includes(searchTerm)
      );

      if (filteredItems.length === 0) {
        masterInventoryTableBody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-slate-400 italic">No matching stock items found.</td></tr>`;
        masterInventoryMobileList.innerHTML = `<div class="p-6 text-center text-slate-400 italic text-xs">No matching stock items found.</div>`;
      } else {
        masterInventoryTableBody.innerHTML = filteredItems.map((item) => {
          const originalIdx = inventoryMaster.indexOf(item);
          return `
            <tr>
              <td class="p-2.5 font-mono font-bold text-purple-700">
                <input type="text" id="editRack_${originalIdx}" value="${item.rackSrNo || 'R-001'}" class="w-24 px-2 py-1 border border-slate-200 rounded-lg text-xs font-mono font-bold bg-slate-50 focus:bg-white focus:ring-2 focus:ring-purple-600 outline-none" />
              </td>
              <td class="p-2.5 font-bold text-slate-800">
                <input type="text" id="editName_${originalIdx}" value="${item.name}" class="w-full px-2 py-1 border border-slate-200 rounded-lg text-xs font-semibold bg-slate-50 focus:bg-white focus:ring-2 focus:ring-purple-600 outline-none" />
              </td>
              <td class="p-2.5 text-right font-mono font-bold">
                <input type="number" id="editRate_${originalIdx}" value="${item.rate || 0}" step="0.01" inputmode="decimal" class="w-20 px-2 py-1 text-right border border-slate-200 rounded-lg text-xs font-mono font-bold bg-slate-50 focus:bg-white focus:ring-2 focus:ring-purple-600 outline-none text-emerald-600" />
              </td>
              <td class="p-2.5 text-center font-mono font-bold">
                <div class="flex items-center justify-center gap-1">
                  <input type="number" id="editStock_${originalIdx}" value="${item.stock || 0}" step="0.01" inputmode="decimal" class="w-16 px-2 py-1 text-center border border-slate-200 rounded-lg text-xs font-mono font-bold bg-slate-50 focus:bg-white focus:ring-2 focus:ring-purple-600 outline-none ${(item.stock || 0) <= 5 ? 'text-red-500' : 'text-slate-800'}" />
                  <span class="text-[10px] text-slate-500 font-normal uppercase">${item.unit || 'pcs'}</span>
                </div>
              </td>
              <td class="p-2.5 text-center space-x-1">
                <button onclick="saveStockEdit(${originalIdx})" class="px-2.5 py-1 bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold rounded-lg text-[11px] shadow-2xs transition">Save</button>
                <button onclick="deleteMasterItem(${originalIdx})" class="px-2 py-1 bg-red-50 hover:bg-red-100 text-red-600 font-bold rounded-lg text-[11px] transition">×</button>
              </td>
            </tr>
          `;
        }).join('');

        masterInventoryMobileList.innerHTML = filteredItems.map((item) => {
          const originalIdx = inventoryMaster.indexOf(item);
          return `
            <div class="bg-slate-50 border border-slate-200 rounded-2xl p-3 space-y-2.5 shadow-2xs">
              <div class="flex items-center justify-between">
                <input type="text" id="editRack_m_${originalIdx}" value="${item.rackSrNo || 'R-001'}" class="px-2 py-1 border border-slate-300 rounded-xl text-xs font-mono font-bold text-purple-700 bg-white focus:ring-2 focus:ring-purple-600 outline-none w-28" />
                <button onclick="deleteMasterItem(${originalIdx})" class="text-xs bg-red-100 text-red-600 font-bold px-2.5 py-1.5 rounded-xl">Delete</button>
              </div>
              <div>
                <input type="text" id="editName_m_${originalIdx}" value="${item.name}" class="w-full px-2.5 py-1.5 border border-slate-300 rounded-xl text-xs font-bold text-slate-800 bg-white focus:ring-2 focus:ring-purple-600 outline-none" />
              </div>
              <div class="grid grid-cols-2 gap-2 text-xs">
                <div>
                  <label class="text-[10px] font-bold uppercase tracking-wider text-slate-500 block mb-0.5">Rate (₹)</label>
                  <input type="number" id="editRate_m_${originalIdx}" value="${item.rate || 0}" step="0.01" inputmode="decimal" class="w-full px-2.5 py-1.5 border border-slate-300 rounded-xl text-xs font-mono font-bold bg-white focus:ring-2 focus:ring-purple-600 outline-none text-emerald-600" />
                </div>
                <div>
                  <label class="text-[10px] font-bold uppercase tracking-wider text-slate-500 block mb-0.5">Stock (${item.unit || 'pcs'})</label>
                  <input type="number" id="editStock_m_${originalIdx}" value="${item.stock || 0}" step="0.01" inputmode="decimal" class="w-full px-2.5 py-1.5 border border-slate-300 rounded-xl text-xs font-mono font-bold bg-white focus:ring-2 focus:ring-purple-600 outline-none ${(item.stock || 0) <= 5 ? 'text-red-500' : 'text-slate-800'}" />
                </div>
              </div>
              <button onclick="saveStockEditMobile(${originalIdx})" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 rounded-xl text-xs transition shadow-xs">Save Changes</button>
            </div>
          `;
        }).join('');
      }
    }

    window.saveStockEdit = function(index) {
      const rackInput = document.getElementById(`editRack_${index}`);
      const nameInput = document.getElementById(`editName_${index}`);
      const rateInput = document.getElementById(`editRate_${index}`);
      const stockInput = document.getElementById(`editStock_${index}`);

      if (!rackInput || !nameInput || !rateInput || !stockInput) return;

      inventoryMaster[index].rackSrNo = rackInput.value.trim() || 'R-001';
      inventoryMaster[index].name = nameInput.value.trim();
      inventoryMaster[index].rate = parseFloat(rateInput.value) || 0;
      inventoryMaster[index].stock = parseFloat(stockInput.value) || 0;

      saveInventoryToStorage();
      renderMasterInventory();
    };

    window.saveStockEditMobile = function(index) {
      const rackInput = document.getElementById(`editRack_m_${index}`);
      const nameInput = document.getElementById(`editName_m_${index}`);
      const rateInput = document.getElementById(`editRate_m_${index}`);
      const stockInput = document.getElementById(`editStock_m_${index}`);

      if (!rackInput || !nameInput || !rateInput || !stockInput) return;

      inventoryMaster[index].rackSrNo = rackInput.value.trim() || 'R-001';
      inventoryMaster[index].name = nameInput.value.trim();
      inventoryMaster[index].rate = parseFloat(rateInput.value) || 0;
      inventoryMaster[index].stock = parseFloat(stockInput.value) || 0;

      saveInventoryToStorage();
      renderMasterInventory();
    };

    saveMasterItemBtn.addEventListener('click', () => {
      const rackSrNo = masterRackSrNo.value.trim() || 'R-001';
      const name = masterItemName.value.trim();
      const rate = parseFloat(masterItemRate.value) || 0;
      const stock = parseFloat(masterItemStock.value) || 0;
      const unit = masterItemUnit.value;
      if (!name) return;

      inventoryMaster.push({ rackSrNo, name, rate, stock, unit });
      saveInventoryToStorage();
      stockSearchInput.value = '';
      renderMasterInventory();
      toggleModal(addStockModalOverlay, false);
    });

    window.deleteMasterItem = function(index) {
      inventoryMaster.splice(index, 1);
      saveInventoryToStorage();
      renderMasterInventory();
    };

    openMasterInventoryModalBtn.addEventListener('click', () => {
      closeDrawer();
      stockSearchInput.value = '';
      renderMasterInventory();
      toggleModal(masterInventoryModalOverlay, true);
    });

    closeMasterInventoryModalBtn.addEventListener('click', () => {
      toggleModal(masterInventoryModalOverlay, false);
    });

    itemNameInput.addEventListener('input', function() {
      const query = this.value.trim().toLowerCase();
      if (!query) {
        suggestionsBox.classList.add('hidden');
        return;
      }

      const matches = inventoryMaster.filter(item => 
        item.name.toLowerCase().includes(query) || 
        (item.rackSrNo || '').toLowerCase().includes(query)
      );

    function calculateCartTotals() {
      const subtotal = cartItems.reduce((acc, i) => acc + i.cost, 0);
      const gstPct = parseFloat(gstRateInput.value) || 0;
      const taxAmount = (subtotal * gstPct) / 100;
      const discount = parseFloat(discountInput.value) || 0;
      const grandTotal = Math.max(0, subtotal + taxAmount - discount);
      
      const cashPaid = parseFloat(cashSplitInput.value) || 0;
      let remainingUpi = grandTotal - cashPaid;
      let changeReturn = 0;

      if (remainingUpi < 0) {
        changeReturn = Math.abs(remainingUpi);
        remainingUpi = 0;
        changeReturnRow.classList.remove('hidden');
        changeReturnText.textContent = `₹ ${changeReturn.toFixed(2)}`;
      } else {
        changeReturnRow.classList.add('hidden');
      }

      subtotalText.textContent = `₹ ${subtotal.toFixed(2)}`;
      gstPctDisplay.textContent = gstPct.toString();
      gstCalculatedText.textContent = `+₹ ${taxAmount.toFixed(2)}`;
      discountCalculatedText.textContent = `-₹ ${discount.toFixed(2)}`;
      grandTotalText.textContent = `₹ ${grandTotal.toFixed(2)}`;
      billResult.textContent = `₹ ${remainingUpi.toFixed(2)}`;

      return { subtotal, gstPct, taxAmount, discount, grandTotal, cashPaid, remainingUpi, changeReturn };
    }

    function drawRoundedRect(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      if (ctx.roundRect) ctx.roundRect(x, y, width, height, radius);
      else {
        ctx.moveTo(x + radius, y);
        ctx.arcTo(x + width, y, x + width, y + height, radius);
        ctx.arcTo(x + width, y + height, x, y + height, radius);
        ctx.arcTo(x, y + height, x, y, radius);
        ctx.arcTo(x, y, x + width, y, radius);
      }
      ctx.fill();
    }

    function generateQrCode(text) {
      return new Promise((resolve) => {
        rawQrWrapper.innerHTML = '';
        new QRCode(rawQrWrapper, {
          text: text,
          width: 560,
          height: 560,
          colorDark: "#000000",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.M
        });

        const checkCanvas = setInterval(() => {
          const qrCanvas = rawQrWrapper.querySelector('canvas');
          if (qrCanvas) {
            clearInterval(checkCanvas);
            resolve(qrCanvas);
          }
        }, 20);
      });
    }

    async function generateAndShowStandee() {
      const merchant = merchantNameInput.value.trim() || 'Merchant Name';
      const vpa = getVpa();
      const amount = amountInput.value.trim();
      const activeTheme = themeMap[activeThemeKey] || themeMap['theme-purple'];

      const SCALE = Math.max(2, window.devicePixelRatio || 2);

      let upiUri = `upi://pay?pa=${vpa}&pn=${encodeURIComponent(merchant)}&mc=0000&mode=02&purpose=00&cu=INR`;
      if (amount) upiUri += `&am=${encodeURIComponent(amount)}`;

      const qrSourceCanvas = await generateQrCode(upiUri);

      const centerX = canvas.width / 2;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (currentMode === 'standee') {
        ctx.fillStyle = activeTheme.primary;
        ctx.beginPath();
        ctx.arc(centerX, 50 * SCALE, 24 * SCALE, 0, 2 * Math.PI);
        ctx.fill();

        ctx.fillStyle = "#ffffff";
        ctx.font = `800 ${18 * SCALE}px 'Plus Jakarta Sans', sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("SM", centerX, 50 * SCALE);

        ctx.fillStyle = activeTheme.primary;
        ctx.font = `800 ${22 * SCALE}px 'Plus Jakarta Sans', sans-serif`;
        ctx.textBaseline = "alphabetic";
        ctx.fillText("Solid Money App", centerX, 102 * SCALE);

        ctx.font = `700 ${13.5 * SCALE}px 'Plus Jakarta Sans', sans-serif`;
        const textWidth = ctx.measureText(merchant).width;
        const pillWidth = Math.max(180 * SCALE, Math.min(320 * SCALE, textWidth + (32 * SCALE)));
        const pillHeight = 32 * SCALE;
        const pillX = centerX - (pillWidth / 2);
        const pillY = 116 * SCALE;

        ctx.fillStyle = activeTheme.pill;
        drawRoundedRect(ctx, pillX, pillY, pillWidth, pillHeight, 16 * SCALE);

        ctx.fillStyle = "#ffffff";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(merchant, centerX, pillY + (16 * SCALE));

        const qrSize = 210 * SCALE;
        const qrX = centerX - (qrSize / 2);
        ctx.drawImage(qrSourceCanvas, qrX, 162 * SCALE, qrSize, qrSize);

        if (amount) {
          ctx.fillStyle = "#10b981";
          ctx.font = `800 ${14 * SCALE}px 'JetBrains Mono', monospace`;
          ctx.textAlign = "center";
          ctx.textBaseline = "alphabetic";
          ctx.fillText(`PAY: ₹${amount}`, centerX, 396 * SCALE);
        }

        ctx.fillStyle = "#1e293b";
        ctx.font = `800 ${15 * SCALE}px 'Plus Jakarta Sans', sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "alphabetic";
        ctx.fillText("BHIM  |  UPI", centerX, 422 * SCALE);

        ctx.fillStyle = "#64748b";
        ctx.font = `600 ${8 * SCALE}px 'Plus Jakarta Sans', sans-serif`;
        ctx.fillText("BHARAT INTERFACE FOR MONEY     UNIFIED PAYMENTS INTERFACE", centerX, 436 * SCALE);

        const digits = getDigits();
        ctx.fillStyle = "#0f172a";
        ctx.font = `700 ${10.5 * SCALE}px 'JetBrains Mono', monospace`;
        ctx.fillText(`Terminal 1-Q${digits}`, centerX, 452 * SCALE);

      } else {
        ctx.fillStyle = activeTheme.primary;
        ctx.fillRect(0, 0, canvas.width, 80 * SCALE);

        ctx.fillStyle = "#ffffff";
        ctx.font = `800 ${16 * SCALE}px 'Plus Jakarta Sans', sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "alphabetic";
        ctx.fillText("SCAN & PAY WITH ANY UPI APP", centerX, 38 * SCALE);

        ctx.font = `600 ${10 * SCALE}px 'Plus Jakarta Sans', sans-serif`;
        ctx.fillStyle = "#ffffff";
        ctx.globalAlpha = 0.8;
        ctx.fillText("GPay • PhonePe • Paytm • BHIM", centerX, 58 * SCALE);
        ctx.globalAlpha = 1.0;

        ctx.fillStyle = "#0f172a";
        ctx.font = `800 ${18 * SCALE}px 'Plus Jakarta Sans', sans-serif`;
        ctx.textAlign = "center";
        ctx.fillText(merchant, centerX, 112 * SCALE);

        ctx.fillStyle = activeTheme.primary;
        ctx.font = `700 ${12 * SCALE}px 'JetBrains Mono', monospace`;
        ctx.fillText(vpa, centerX, 130 * SCALE);

        const qrSize = 210 * SCALE;
        const qrX = centerX - (qrSize / 2);
        ctx.drawImage(qrSourceCanvas, qrX, 146 * SCALE, qrSize, qrSize);

        if (amount) {
          ctx.fillStyle = "#10b981";
          ctx.font = `800 ${14 * SCALE}px 'JetBrains Mono', monospace`;
          ctx.textAlign = "center";
          ctx.fillText(`Amount: ₹${amount}`, centerX, 382 * SCALE);
        }

        ctx.fillStyle = "#1e293b";
        ctx.font = `800 ${15 * SCALE}px 'Plus Jakarta Sans', sans-serif`;
        ctx.textAlign = "center";
        ctx.fillText("BHIM  |  UPI", centerX, 406 * SCALE);
      }

      openQrModal();
    }

    window.addEventListener('load', async () => {
      document.fonts.ready.then(async () => {
        loadFixedStates();
        updateVpaPreview();
      });
    });

    renderBtn.addEventListener('click', generateAndShowStandee);

    downloadBtn.addEventListener('click', function() {
      const link = document.createElement('a');
      const sanitizedName = merchantNameInput.value.trim().replace(/\s+/g, '_') || 'Merchant';
      link.href = canvas.toDataURL("image/png");
      link.download = `UPI-Studio-${sanitizedName}.png`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    });

    printBtn.addEventListener('click', () => { window.print(); });
  </script>
